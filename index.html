<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#182a3e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="台球计分板">
  <meta name="description" content="追分与中式八球手机计分工具">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>台球计分板</title>
  <style>
    :root { color-scheme:light; --paper:#f4f2ed; --card:#fff; --ink:#15191e; --muted:#74787d; --line:#d1cfca; --navy:#182a3e; --navy-soft:#edf1f5; --orange:#eb6a32; --red:#c44840; --safe-top:env(safe-area-inset-top,0px); --safe-right:env(safe-area-inset-right,0px); --safe-bottom:env(safe-area-inset-bottom,0px); --safe-left:env(safe-area-inset-left,0px); }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; min-height:100%; background:var(--paper); color:var(--ink); }
    body { font-family:"Arial Narrow","DIN Alternate","PingFang SC","Microsoft YaHei",sans-serif; min-height:100dvh; }
    button,input,select { font:inherit; } button { color:inherit; touch-action:manipulation; }
    .app { width:min(100%,760px); min-height:100dvh; margin:auto; padding:18px 12px calc(28px + var(--safe-bottom)); }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:0 1px 16px; }
    h1 { margin:0; font-size:24px; line-height:1; letter-spacing:.04em; }
    .top-actions { display:flex; gap:7px; }
    .plain-btn { height:38px; padding:0 14px; border:1px solid var(--line); border-radius:4px; background:var(--card); color:var(--ink); cursor:pointer; }
    button { transition:transform .08s ease,background-color .08s ease,box-shadow .08s ease; }
    button.tap-feedback { transform:scale(.94); box-shadow:inset 0 0 0 2px var(--orange); }
    .mode-tabs { display:grid; grid-template-columns:1fr 1fr; margin-bottom:14px; overflow:hidden; border:1px solid var(--navy); border-radius:4px; background:var(--card); }
    .mode-tab { height:46px; border:0; background:transparent; color:var(--navy); font-weight:800; letter-spacing:.04em; }
    .mode-tab.active { background:var(--navy); color:#fff; }
    .match-strip { display:flex; justify-content:space-between; align-items:center; min-height:26px; margin-bottom:7px; color:var(--muted); font-size:12px; }
    .match-strip strong { color:var(--ink); font-size:13px; letter-spacing:.04em; }
    .score-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
    .score-card { position:relative; min-height:184px; padding:0; overflow:hidden; border:2px solid var(--navy); border-radius:4px; background:var(--card); cursor:pointer; }
    .score-card.active { border-color:var(--orange); }
    .player-name { display:grid; place-items:center; height:48px; padding:0 40px 0 10px; border-bottom:2px solid var(--navy); background:var(--navy); color:#fff; font-size:16px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .score-card.active .player-name { border-color:var(--orange); }
    .player-score { display:grid; place-items:center; min-height:132px; padding:4px; color:var(--ink); font-family:"Arial Narrow","DIN Alternate",sans-serif; font-size:clamp(68px,22vw,112px); font-weight:900; line-height:1; letter-spacing:-.05em; font-variant-numeric:tabular-nums; }
    .score-card.score-flash .player-score { animation:scoreFlash .34s ease; }
    @keyframes scoreFlash { 0%{background:var(--orange);color:#fff} 100%{background:#fff;color:var(--ink)} }
    .control-panel { margin-top:11px; overflow:hidden; border:1px solid var(--line); border-radius:4px; background:var(--card); }
    .selected-row { display:flex; align-items:center; justify-content:space-between; min-height:52px; padding:8px 10px; border-bottom:1px solid var(--line); }
    .selected-row span { color:var(--muted); font-size:12px; }
    .selected-row select { min-width:130px; height:34px; padding:0 9px; border:1px solid var(--line); border-radius:2px; background:#fff; color:var(--ink); font-weight:700; }
    .score-actions { padding:11px 10px; }
    .action-label { margin:0 0 7px; color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.1em; }
    .points-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
    .point-btn { min-height:61px; border:1px solid var(--navy); border-radius:3px; background:#fff; color:var(--navy); cursor:pointer; }
    .point-btn:active { background:#e9eef3; }
    .point-btn.minus { border-color:#d5a29e; color:var(--red); }
    .point-btn.minus:active { background:#f8e9e7; }
    .point-btn b { display:block; font-size:21px; } .point-btn small { display:block; margin-top:2px; color:var(--muted); font-size:10px; }
    .minus-group { margin-top:12px; }
    .eight-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .rack-btn { min-height:72px; border:1px solid var(--navy); border-radius:3px; background:#fff; color:var(--navy); font-weight:800; cursor:pointer; }
    .rack-btn:active { background:#e9eef3; }
    .rack-btn.adjust { border-color:#d5a29e; background:#fff; color:var(--red); }
    .rack-btn.adjust:active { background:#f8e9e7; }
    .rack-btn b { display:block; font-size:24px; } .rack-btn small { display:block; margin-top:4px; font-weight:500; opacity:.72; }
    .sub-actions { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:9px; }
    .sub-btn { min-height:47px; padding:5px 4px; border:1px solid var(--line); border-radius:3px; background:var(--card); color:var(--ink); font-size:12px; font-weight:700; }
    .sub-btn.is-empty { color:#9b9b98; } .sub-btn.danger { color:var(--red); }
    .history { margin-top:18px; padding-top:13px; border-top:1px solid var(--line); }
    .section-title { display:flex; justify-content:space-between; align-items:center; margin-bottom:7px; }
    .section-title h2 { margin:0; font-size:13px; letter-spacing:.06em; } .section-title span { color:var(--muted); font-size:10px; }
    .history-list { display:grid; gap:5px; }
    .history-item { display:grid; grid-template-columns:42px 1fr auto; gap:8px; align-items:center; min-height:40px; padding:7px 10px; border-left:3px solid var(--navy); background:var(--card); font-size:12px; }
    .history-item.negative { border-left-color:var(--red); } .history-time { color:var(--muted); font-variant-numeric:tabular-nums; }
    .history-value { font-weight:900; color:var(--navy); } .history-item.negative .history-value { color:var(--red); }
    .empty { padding:18px 0; color:var(--muted); font-size:12px; text-align:center; }
    dialog { width:min(calc(100% - 28px),430px); max-height:calc(100dvh - 30px); padding:0; overflow:auto; border:1px solid var(--navy); border-radius:3px; background:var(--paper); color:var(--ink); }
    dialog::backdrop { background:rgba(10,14,18,.72); }
    .dialog-head { padding:17px 17px 12px; border-bottom:1px solid var(--line); } .dialog-head h2 { margin:0 0 4px; font-size:18px; } .dialog-head p { margin:0; color:var(--muted); font-size:11px; }
    .dialog-body { padding:15px 17px; } .setup-row { margin-bottom:12px; } .setup-row label { display:block; margin-bottom:5px; color:var(--muted); font-size:11px; }
    .setup-row input,.setup-row select { width:100%; height:42px; padding:0 10px; border:1px solid var(--line); border-radius:2px; background:#fff; color:var(--ink); }
    .name-fields { display:grid; gap:7px; } .dialog-actions { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:15px; }
    .primary-btn,.secondary-btn { min-height:44px; border-radius:2px; cursor:pointer; } .primary-btn { border:1px solid var(--navy); background:var(--navy); color:#fff; font-weight:800; } .secondary-btn { border:1px solid var(--line); background:transparent; color:var(--muted); }
    .records-list { display:grid; gap:8px; }
    .record-card { padding:11px; border:1px solid var(--line); background:#fff; }
    .record-top { display:flex; justify-content:space-between; gap:8px; margin-bottom:8px; font-size:11px; color:var(--muted); }
    .record-mode { color:var(--orange); font-weight:900; }
    .record-scores { display:flex; flex-wrap:wrap; gap:6px; }
    .record-score { padding:5px 7px; background:#edf0f3; color:var(--navy); font-size:12px; font-weight:800; }
    .record-delete { width:100%; margin-top:9px; padding:7px; border:0; border-top:1px solid var(--line); background:transparent; color:var(--red); font-size:11px; }
    .confirm-copy { margin:0; color:var(--muted); font-size:13px; line-height:1.7; }
    .toast { position:fixed; left:50%; bottom:calc(22px + var(--safe-bottom)); z-index:20; width:max-content; max-width:calc(100% - 28px); transform:translate(-50%,16px); padding:11px 15px; border-radius:4px; background:var(--ink); color:#fff; font-size:13px; font-weight:700; text-align:center; opacity:0; pointer-events:none; box-shadow:0 8px 24px rgba(0,0,0,.2); transition:.15s ease; }
    .toast.show { opacity:1; transform:translate(-50%,0); } [hidden] { display:none!important; }
    @media (orientation:portrait) and (max-width:900px) {
      html,body { width:100%; height:100%; min-height:100%; overflow:hidden; }
      .app { position:fixed; top:0; left:0; width:100dvh; max-width:none; height:100dvw; min-height:100dvw; overflow:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; transform:rotate(90deg) translateY(-100%); transform-origin:top left; }
      .toast { position:absolute; }
    }
    @media (orientation:landscape) and (max-height:600px) and (min-width:560px), (orientation:portrait) and (max-width:900px) {
      html,body { min-height:100dvh; overflow:auto; }
      .app { width:100%; max-width:none; min-height:100dvh; padding:max(6px,var(--safe-top)) max(8px,var(--safe-right)) max(7px,var(--safe-bottom)) max(8px,var(--safe-left)); display:grid; grid-template-columns:1fr; grid-template-rows:32px 35px 19px minmax(120px,1fr) 58px 38px; grid-template-areas:"top" "tabs" "match" "scores" "controls" "subs"; row-gap:4px; }
      .topbar { grid-area:top; padding:0; }
      h1 { font-size:20px; }
      .plain-btn { height:32px; padding:0 12px; font-size:12px; }
      .mode-tabs { grid-area:tabs; height:39px; margin:0; }
      .mode-tab { height:37px; font-size:13px; }
      .match-strip { grid-area:match; min-height:24px; margin:0; }
      .score-grid { grid-area:scores; gap:7px; min-height:0; }
      .score-grid[data-count="3"] { grid-template-columns:repeat(3,minmax(0,1fr)); }
      .score-grid[data-count="4"] { grid-template-columns:repeat(4,minmax(0,1fr)); }
      .score-card { min-height:0; height:100%; }
      .player-name { height:38px; font-size:14px; }
      .player-score { min-height:0; height:calc(100% - 38px); font-size:clamp(56px,11vh,88px); }
      .control-panel { grid-area:controls; display:block; height:58px; margin:0; }
      .selected-row { display:none; }
      .selected-row select { height:31px; }
      .score-actions { height:100%; padding:5px 6px; }
      #chaseControls { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
      #chaseControls[hidden],#eightControls[hidden] { display:none; }
      .action-label { margin-bottom:3px; }
      .points-grid { gap:6px; }
      .point-btn { min-height:44px; }
      .point-btn b { font-size:18px; }
      .minus-group { margin-top:0; }
      .rack-btn { min-height:58px; }
      .sub-actions { grid-area:subs; margin:0; }
      .sub-btn { min-height:42px; }
      .history { display:none; }
      .history-list { grid-template-columns:repeat(2,minmax(0,1fr)); }
      dialog { max-height:calc(100dvh - 16px); }
    }
    @media(min-width:600px){ .app{padding-top:26px}.score-grid[data-count="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}.score-grid[data-count="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}.score-card{min-height:220px}.player-score{min-height:169px;font-size:96px} }
    @media (orientation:landscape) and (max-height:600px) and (min-width:560px) { .app{padding-top:max(7px,var(--safe-top))}.score-card{min-height:0}.player-score{min-height:0;font-size:clamp(56px,11vh,88px)} }
    @media (orientation:portrait) and (max-width:900px) { .app{width:100dvh;height:100dvw;min-height:100dvw}.score-card{min-height:0}.player-score{min-height:0;font-size:clamp(56px,11vh,88px)} }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><h1>台球计分板</h1><div class="top-actions"><button class="plain-btn" id="recordsBtn" type="button">记录</button><button class="plain-btn" id="setupBtn" type="button">设置</button></div></header>
    <nav class="mode-tabs" aria-label="计分模式"><button class="mode-tab active" data-mode="chase" type="button">追分 · 14710</button><button class="mode-tab" data-mode="eight" type="button">中式八球</button></nav>
    <div class="match-strip"><strong id="modeTitle">追分赛</strong><span id="matchRule">单人独立加减分</span></div>
    <section class="score-grid" id="scoreGrid" aria-label="选手比分"></section>
    <section class="control-panel">
      <div class="selected-row"><span>当前选手</span><select id="selectedPlayer"></select></div>
      <div class="score-actions" id="chaseControls">
        <p class="action-label">加分</p>
        <div class="points-grid"><button class="point-btn" data-delta="1" data-label="犯规得分" type="button"><b>+1</b><small>犯规</small></button><button class="point-btn" data-delta="4" data-label="普胜" type="button"><b>+4</b><small>普胜</small></button><button class="point-btn" data-delta="7" data-label="小金" type="button"><b>+7</b><small>小金</small></button><button class="point-btn" data-delta="10" data-label="大金" type="button"><b>+10</b><small>大金</small></button></div>
        <div class="minus-group"><p class="action-label">扣分</p><div class="points-grid"><button class="point-btn minus" data-delta="-1" data-label="扣1分" type="button"><b>−1</b><small>犯规</small></button><button class="point-btn minus" data-delta="-4" data-label="扣4分" type="button"><b>−4</b><small>普胜</small></button><button class="point-btn minus" data-delta="-7" data-label="扣7分" type="button"><b>−7</b><small>小金</small></button><button class="point-btn minus" data-delta="-10" data-label="扣10分" type="button"><b>−10</b><small>大金</small></button></div></div>
      </div>
      <div class="score-actions" id="eightControls" hidden><div class="eight-actions"><button class="rack-btn" data-delta="1" data-label="赢得一局" type="button"><b>+1 局</b><small>本局获胜</small></button><button class="rack-btn adjust" data-delta="-1" data-label="扣除一局" type="button"><b>−1 局</b><small>误记调整</small></button></div></div>
    </section>
    <div class="sub-actions"><button class="sub-btn" id="undoBtn" type="button">撤销上一步</button><button class="sub-btn" id="saveMatchBtn" type="button">保存本场</button><button class="sub-btn danger" id="resetBtn" type="button">当前模式清零</button></div>
    <section class="history"><div class="section-title"><h2>计分记录</h2><span id="roundCount">0次变动</span></div><div class="history-list" id="historyList"></div></section>
    <div class="toast" id="toast" role="status"></div>
  </main>
  <dialog id="setupDialog"><form id="setupForm"><div class="dialog-head"><h2>对局设置</h2><p id="setupHint">追分模式支持2—4人。</p></div><div class="dialog-body"><div class="setup-row" id="countRow"><label for="playerCount">玩家人数</label><select id="playerCount"><option value="2">2人</option><option value="3">3人</option><option value="4">4人</option></select></div><div class="setup-row" id="raceRow" hidden><label for="raceTarget">中八局制</label><select id="raceTarget"><option value="3">抢3</option><option value="5">抢5</option><option value="7">抢7</option><option value="9">抢9</option><option value="11">抢11</option></select></div><div class="name-fields" id="nameFields"></div><div class="dialog-actions"><button class="secondary-btn" id="cancelSetup" type="button">取消</button><button class="primary-btn" type="submit">保存设置</button></div></div></form></dialog>
  <dialog id="recordsDialog"><div class="dialog-head"><h2>历史记录</h2><p>按保存时间保留在当前手机。</p></div><div class="dialog-body"><div class="records-list" id="recordsList"></div><div class="dialog-actions"><button class="secondary-btn" id="clearRecordsBtn" type="button">清空记录</button><button class="primary-btn" id="closeRecordsBtn" type="button">完成</button></div></div></dialog>
  <dialog id="confirmDialog"><div class="dialog-head"><h2 id="confirmTitle">确认操作</h2></div><div class="dialog-body"><p class="confirm-copy" id="confirmCopy"></p><div class="dialog-actions"><button class="secondary-btn" id="confirmCancel" type="button">取消</button><button class="primary-btn" id="confirmOk" type="button">确认</button></div></div></dialog>
  <script src="./app.js?v=12"></script>
</body>
</html>
